name: Bug report
description: Something does not work the way the README says
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Tag or commit, and how it was installed
      placeholder: v0.1.0 or main@abc1234 · pip / npm / from source
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command or code, with any configuration
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Output, stack trace or screenshot
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS · runtime version · model provider, if relevant
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: This is not a security problem (those go through the Security tab, never an issue)
          required: true
